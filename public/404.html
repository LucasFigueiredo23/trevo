<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fora da órbita — Trevo Fest</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140a33">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=DM+Sans:opsz,wght@9..40,400;9..40,700&display=swap" rel="stylesheet">
<style>
  body{
    margin:0; min-height:100svh; display:grid; place-items:center; text-align:center;
    padding:40px 24px; box-sizing:border-box;
    background:
      radial-gradient(40% 35% at 20% 25%, rgba(123,60,255,.45), transparent 70%),
      radial-gradient(35% 30% at 85% 80%, rgba(255,61,190,.3), transparent 70%),
      #140a33;
    color:#efeaff; font-family:"DM Sans", system-ui, sans-serif; line-height:1.6;
  }
  img{width:72px; margin:0 auto 22px; display:block}
  h1{font-family:"Unbounded", system-ui, sans-serif; font-weight:800; letter-spacing:-.02em; line-height:1.05; font-size:clamp(2rem, 7vw, 3.6rem); margin:0 0 14px}
  p{color:#b9addb; margin:0 auto 32px; max-width:40ch}
  a{
    display:inline-block; font-family:"Unbounded", system-ui, sans-serif; font-weight:800; font-size:.95rem;
    text-decoration:none; padding:1.05em 1.7em; border-radius:999px; background:#3dffa8; color:#140a33;
  }
  a:focus-visible{outline:3px solid #3dffa8; outline-offset:3px}
</style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="">
    <h1>Essa página saiu da órbita</h1>
    <p>O endereço não existe, mas o portal continua aberto em 21.11.</p>
    <a href="/">Voltar pra Trevo Fest</a>
  </main>
</body>
</html>
